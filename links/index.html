<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Links | PluginProof</title>

<style>
  :root {
    --bg: #0b0f14;
    --panel: #111824;
    --border: rgba(255,255,255,0.08);
    --text: rgba(255,255,255,0.9);
    --muted: rgba(255,255,255,0.6);
    --accent: #7c5cff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }

  body {
    background: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 20px;
  }

  /* Header */
  .header {
    margin-bottom: 40px;
  }

  .title {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    transition: 0.2s ease;
    display: block;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(124,92,255,0.4);
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
  }

  .card-desc {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  .tag {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* Footer */
  .footer {
    margin-top: 60px;
    color: var(--muted);
    font-size: 13px;
  }

  a {
    color: inherit;
  }
</style>
</head>

<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="title">Links</div>
    <div class="subtitle">
      A simple collection of tools, writing, and places I share updates.
    </div>
  </div>

  <!-- Links -->
<div class="grid">

<a class="card" href="https://app.boombox.io/app/files/dMoJX548KbRkzdggPPLVd7Z1Gq2nWAVeO">
  <div class="card-desc">808 + guitar</div>
</a>

</div>

  </div>

</div>

</body>
</html>
